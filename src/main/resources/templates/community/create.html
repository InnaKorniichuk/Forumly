<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Community</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .container {
      width: 400px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Create Community</h2>

  <div th:replace="~{fragments/navigation :: navigation}"></div>

  <form th:action="@{/communities/create}"
        th:object="${community}"
        method="post">

    <label for="name">Community name</label>
    <input type="text"
           id="name"
           th:field="*{name}"
           placeholder="Enter community name"/>

    <div class="error"
         th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}">
    </div>

    <button type="submit">Create</button>
  </form>
</div>

</body>
</html>
