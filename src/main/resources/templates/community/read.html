<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${community.name}">Community</title>

    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #4f46e5;
            --border: #e5e7eb;
            --up: #e7f3ff;
            --down: #ffe7e7;
            --danger: #ef4444;
            --radius: 14px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 16px;
            background: var(--bg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        }

        .community-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        h1 { margin: 0 0 6px; font-size: 32px; }
        h2 { margin: 0; font-size: 22px; }

        .meta {
            font-size: 14px;
            color: var(--muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions form {
            margin: 0;
        }

        .logout-btn {
            background-color: white;
            color: #4b5563;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .logout-btn:hover {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .create-post-btn {
            background: var(--primary);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .post {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .post:last-child { border-bottom: none; }

        .post-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .post-title a {
            color: var(--text);
            text-decoration: none;
        }

        .post-title a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .post-score {
            font-size: 14px;
            color: var(--muted);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vote-buttons {
            display: flex;
            gap: 6px;
        }

        .vote-buttons button {
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .upvote { background: var(--up); }
        .downvote { background: var(--down); }

        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .delete-btn:hover {
            filter: brightness(0.95);
        }

        .empty {
            color: var(--muted);
            font-style: italic;
            padding: 10px 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
        }
        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }

        .edit-btn:hover {
            filter: brightness(0.95);
        }
    </style>
</head>

<body>
<div class="container">

    <div class="card">
        <div class="community-header">
            <div>
                <h1 th:text="${community.name}">Community Name</h1>
                <div class="meta">
                    Created:
                    <span th:text="${#temporals.format(community.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    · Owner:
                    <strong th:text="${community.owner.nickname}"></strong>
                </div>
            </div>

            <div class="header-actions">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="posts-header">
            <h2>Posts</h2>
            <a th:href="@{'/posts/create/' + ${community.id}}" class="create-post-btn">
                + Create post
            </a>
        </div>

        <div th:if="${community.posts != null and !community.posts.isEmpty()}">
            <div class="post" th:each="post : ${community.posts}">

                <div class="post-title">
                    <a th:href="@{'/posts/' + ${post.id} + '/read'}"
                       th:text="${post.title}">
                    </a>
                </div>

                <div class="post-footer">
                    <div class="post-score">
                        Score: <strong th:text="${post.score}">0</strong>
                    </div>

                    <div class="actions">

                        <div class="vote-buttons">
                            <form th:action="@{/votes/posts/{id}/add(id=${post.id})}" method="post">
                                <input type="hidden" name="voteType" value="UP">
                                <button class="upvote">⬆</button>
                            </form>

                            <form th:action="@{/votes/posts/{id}/add(id=${post.id})}" method="post">
                                <input type="hidden" name="voteType" value="DOWN">
                                <button class="downvote">⬇</button>
                            </form>
                        </div>

                        <a th:href="@{/posts/{id}/update(id=${post.id})}"
                           class="edit-btn">
                            ✏️
                        </a>

                        <form th:action="@{/posts/{id}/delete(id=${post.id})}"
                              method="get"
                              onsubmit="return confirm('Delete this post permanently?');">
                            <button class="delete-btn">🗑</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>

        <div class="empty"
             th:if="${community.posts == null or community.posts.isEmpty()}">
            No posts yet. Be the first to write one ✨
        </div>
    </div>

    <a href="/communities/getAll" class="back-link">
        ← Back to communities
    </a>

</div>
</body>
</html>
