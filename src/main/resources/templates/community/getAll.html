<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Communities</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            margin: 0;
        }

        .create-btn {
            background-color: #4f46e5;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }

        .create-btn:hover {
            background-color: #4338ca;
        }

        table {
            width: 100%;
            background-color: white;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }

        thead {
            background-color: #eef2ff;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 13px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #4b5563;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .community-link {
            color: #4f46e5;
            font-weight: 500;
            text-decoration: none;
        }

        .community-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #6b7280;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }

        .empty-state a {
            display: inline-block;
            margin-top: 16px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .empty-state a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>Communities</h1>
        <a href="/communities/create" class="create-btn">+ Create Community</a>
    </header>

    <table th:if="${communities != null and !communities.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Created</th>
            <th>Owner</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="community : ${communities}">
            <td th:text="${community.id}">1</td>

            <td>
                <a class="community-link"
                   th:href="@{'/communities/' + ${community.id} + '/read'}"
                   th:text="${community.name}">
                    Community Name
                </a>
            </td>

            <td th:text="${#temporals.format(community.createdAt, 'dd MMM yyyy, HH:mm')}">
                10 Feb 2026, 18:00
            </td>

            <td th:text="${community.owner.nickname}">
                owner
            </td>

            <td>
                <form th:action="@{/communities/{id}/delete(id=${community.id})}"
                      method="get"
                      onsubmit="return confirm('Delete this community permanently?');">

                    <button type="submit"
                            style="
                  background:#ef4444;
                  color:white;
                  border:none;
                  padding:6px 12px;
                  border-radius:8px;
                  cursor:pointer;
                  font-size:13px;
                ">
                        🗑 Delete
                    </button>

                </form>
            </td>

        </tr>
        </tbody>
    </table>

    <div class="empty-state"
         th:if="${communities == null or communities.isEmpty()}">
        <p>No communities yet.</p>
        <a href="/communities/create">Create the first one</a>
    </div>

</div>
</body>
</html>
