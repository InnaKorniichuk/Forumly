<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit profile</title>

    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background:#f4f6fb;
            padding:40px;
            color:#1f2937;
        }

        .container {
            max-width:600px;
            margin:auto;
            background:#fff;
            padding:32px;
            border-radius:14px;
            box-shadow:0 12px 30px rgba(0,0,0,0.06);
        }

        h1 {
            margin-top:0;
        }

        label {
            display:block;
            font-weight:600;
            margin-top:16px;
        }

        input {
            width:100%;
            padding:10px;
            margin-top:6px;
            border-radius:8px;
            border:1px solid #d1d5db;
            font-size:14px;
        }

        .error {
            color:#dc2626;
            font-size:13px;
            margin-top:4px;
        }

        .actions {
            display:flex;
            justify-content:space-between;
            margin-top:32px;
        }

        button {
            background:#4f46e5;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:10px;
            font-weight:600;
            cursor:pointer;
        }

        .cancel {
            text-decoration:none;
            color:#4b5563;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="container">

    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <h1>Edit profile</h1>

    <p style="color:#6b7280">
        Editing profile for <strong th:text="${userInfo.nickname}">nickname</strong>
    </p>

    <form th:action="@{/users/{id}/update(id=${userInfo.id})}"
          th:object="${userUpdate}"
          method="post">

        <label>Nickname</label>
        <input type="text" th:field="*{nickname}">
        <div class="error" th:if="${#fields.hasErrors('nickname')}"
             th:errors="*{nickname}"></div>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <div class="error" th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}"></div>

        <label>New password</label>
        <input type="password" th:field="*{password}">
        <div class="error" th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}"></div>

        <div class="actions">
            <a class="cancel"
               th:href="@{/users/{id}/read(id=${userInfo.id})}">
                Cancel
            </a>

            <button type="submit">Save changes</button>
        </div>

    </form>

</div>

</body>
</html>
