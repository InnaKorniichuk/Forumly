<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${user.nickname} + ' profile'">User profile</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 40px;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    }

    h1 {
      margin-top: 0;
    }

    .user-meta {
      margin-bottom: 32px;
      color: #374151;
    }

    .user-meta span {
      display: block;
      margin-top: 4px;
    }

    .posts {
      margin-top: 24px;
    }

    .post {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .post-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .post-meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .post-content {
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .post-score {
      font-size: 14px;
      font-weight: 600;
      color: #4a7dff;
    }

    .empty {
      font-style: italic;
      color: #6b7280;
      margin-top: 16px;
    }

    .back-link {
      display: inline-block;
      margin-top: 32px;
      text-decoration: none;
      color: #4f46e5;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="container">

  <div th:replace="~{fragments/navigation :: navigation}"></div>

  <h1 th:text="${user.nickname}">Nickname</h1>

  <div class="user-meta">
    <span><strong>ID:</strong> <span th:text="${user.id}">1</span></span>
    <span><strong>Email:</strong> <span th:text="${user.email}">email@example.com</span></span>
  </div>

  <hr>

  <a th:if="${#authentication.principal.id == user.id}"
     th:href="@{/users/{id}/update(id=${user.id})}"
     style="
     display:inline-block;
     margin:16px 0;
     background:#10b981;
     color:white;
     padding:8px 14px;
     border-radius:8px;
     text-decoration:none;
     font-weight:600;
     font-size:14px;
   ">
    ✏️ Edit profile
  </a>

  <a th:href="@{/communities/{id}/getByUserId(id=${user.id})}"
     style="
     display:inline-block;
     margin:16px 0 24px;
     background:#4f46e5;
     color:white;
     padding:8px 14px;
     border-radius:8px;
     text-decoration:none;
     font-weight:600;
     font-size:14px;
   ">
    👥 Show user communities
  </a>

  <h2>User posts</h2>

  <div class="posts" th:if="${posts != null and !posts.isEmpty()}">
    <div class="post" th:each="post : ${posts}">

      <div class="post-title" th:text="${post.title}">
        Post title
      </div>

      <div class="post-meta">
      <span>
        Community:
        <strong th:text="${post.community.name}">Community name</strong>
      </span>
        ·
        <span th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}">
        2025-01-01 12:00
      </span>
      </div>

      <div class="post-content" th:text="${post.content}">
        Post content
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">

        <div class="post-score">
          Score: <span th:text="${post.score}">0</span>
        </div>

        <form th:action="@{/posts/{user_id}/{id}/delete(user_id=${user.id},id=${post.id})}"
              method="post"
              onsubmit="return confirm('Delete this post permanently?');">

          <button type="submit"
                  style="
                  background:#ef4444;
                  color:white;
                  border:none;
                  padding:6px 12px;
                  border-radius:8px;
                  cursor:pointer;
                  font-size:13px;
                ">
            🗑 Delete
          </button>

        </form>

      </div>

    </div>
  </div>

  <div class="empty" th:if="${posts == null or posts.isEmpty()}">
    This user hasn’t created any posts yet.
  </div>

  <a href="/users" class="back-link">Back to users</a>

</div>

</body>
</html>
