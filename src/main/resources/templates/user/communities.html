<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User communities</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background-color: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions form {
            margin: 0;
        }

        .logout-btn {
            background-color: white;
            color: #4b5563;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .logout-btn:hover {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        h1 {
            margin: 0;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        }

        thead {
            background: #eef2ff;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #4b5563;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .link {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .link:hover {
            text-decoration: underline;
        }

        .empty {
            background: white;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            color: #6b7280;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        }

        .back {
            display: inline-block;
            margin-top: 24px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>User communities</h1>

        <div class="header-actions">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <table th:if="${communities != null and !communities.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Created</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="community : ${communities}">
            <td th:text="${community.id}">1</td>

            <td>
                <a class="link"
                   th:href="@{'/communities/' + ${community.id} + '/read'}"
                   th:text="${community.name}">
                    Community name
                </a>
            </td>

            <td th:text="${#temporals.format(community.createdAt,'yyyy-MM-dd HH:mm')}">
                2025-01-01 12:00
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${communities == null or communities.isEmpty()}">
        This user doesn’t own any communities yet.
    </div>

    <a href="/users" class="back">← Back to users</a>

</div>

</body>
</html>
