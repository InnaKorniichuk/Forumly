<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Forumly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: white;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light">
<div class="register-container">
    <div class="logo">Register</div>

    <div th:if="${param.success}" class="alert alert-success">
        Registration successful! <a th:href="@{/login}" class="alert-link">Login here</a>
    </div>

    <form th:action="@{/users/create}" th:object="${user}" method="post">

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   th:field="*{email}"
                   placeholder="your@email.com"
                   required>
            <div class="form-text">Enter a valid email address</div>
            <div th:if="${#fields.hasErrors('email')}" class="text-danger small">
                <span th:errors="*{email}"></span>
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   th:field="*{password}"
                   required
                   minlength="8">
            <div class="form-text">
                Must be at least 8 characters with uppercase, lowercase, and a number
            </div>
            <div th:if="${#fields.hasErrors('password')}" class="text-danger small">
                <span th:errors="*{password}"></span>
            </div>
        </div>

        <div class="mb-4">
            <label for="nickname" class="form-label">Nickname</label>
            <input type="text"
                   class="form-control"
                   id="nickname"
                   th:field="*{nickname}"
                   required
                   minlength="3"
                   maxlength="50">
            <div class="form-text">3-50 characters</div>
            <div th:if="${#fields.hasErrors('nickname')}" class="text-danger small">
                <span th:errors="*{nickname}"></span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
            Register
        </button>

        <div class="text-center">
            <span class="text-muted">Already have an account?</span>
            <a th:href="@{/login}" class="text-decoration-none ms-1">
                Login
            </a>
        </div>

        <div class="text-center mt-2">
            <a th:href="@{/}" class="text-decoration-none text-muted">
                ← Back to home
            </a>
        </div>
    </form>
</div>
</body>
</html>
