<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #4338ca;
        }

        .cancel {
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
            align-self: center;
        }

        .cancel:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="container">

    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <h1>Create new post</h1>

    <form th:action="@{/posts/create/{id}(id=${community_id})}"
          th:object="${post}"
          method="post">

        <label for="title">Title</label>
        <input type="text"
               id="title"
               th:field="*{title}"
               placeholder="Enter post title">

        <div class="error"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}">
            Title error
        </div>

        <label for="content">Content</label>
        <textarea id="content"
                  th:field="*{content}"
                  placeholder="Write your post here..."></textarea>

        <div class="error"
             th:if="${#fields.hasErrors('content')}"
             th:errors="*{content}">
            Content error
        </div>

        <div class="actions">
            <button type="submit">Create post</button>

            <a th:href="@{/communities/{id}/read(id=${community_id})}"
               class="cancel">
                Cancel
            </a>
        </div>

    </form>

</div>
</body>
</html>
