<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit post</title>

    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 40px;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            font-size: 14px;
            margin-bottom: 6px;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .btn-save {
            background: #4f46e5;
            color: white;
        }

        .btn-save:hover {
            background: #4338ca;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="container">

    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <h1>Edit post</h1>

    <form th:action="@{/posts/{id}/update(id=${postInfo.id})}"
          th:object="${postUpdate}"
          method="post">

        <div>
            <label for="title">Title</label>
            <input id="title"
                   type="text"
                   th:field="*{title}"
                   placeholder="Enter post title">

            <div class="error"
                 th:if="${#fields.hasErrors('title')}"
                 th:errors="*{title}">
                Title error
            </div>
        </div>

        <div>
            <label for="content">Content</label>
            <textarea id="content"
                      th:field="*{content}"
                      placeholder="Write your post here..."></textarea>

            <div class="error"
                 th:if="${#fields.hasErrors('content')}"
                 th:errors="*{content}">
                Content error
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-save">
                💾 Save changes
            </button>

            <a th:href="@{/posts/{id}/read(id=${postInfo.id})}"
               class="btn btn-cancel">
                Cancel
            </a>
        </div>

    </form>

</div>

</body>
</html>
